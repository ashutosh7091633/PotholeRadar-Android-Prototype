kind = "mobile"
previewPath = "/pothole-radar/"
title = "PotholeRadar"
description = "An offline-first mobile prototype for detecting, reviewing, and mapping road impacts. Includes a live sensor dashboard, simulated drive mode, event map, and local detection history for hackathon demonstrations."
version = "1.0.0"
id = "artifacts/pothole-radar"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/pothole-radar/" ]
localPort = 19820

[services.development]
run = "pnpm --filter @workspace/pothole-radar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pothole-radar", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pothole-radar", "run", "serve" ]

[services.env]
PORT = "19820"
BASE_PATH = "/pothole-radar/"
